<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Form</title>
     <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body class="bg-primary">
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card">
                    <div class="card-body">
                        <h3 class="ml-3"><strong>Sign Up</strong></h3>
                        <p class="ml-3 text-muted">Please fill in this form to create an account!</p>
                        <form class="p-3">
                            <div class="form-group">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <input type="text" class="form-control bg-light"placeholder="First Name" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <input type="text" class="form-control bg-light"placeholder="Last Name" required>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <input type="email" class="form-control bg-light" placeholder="Email" required>
                            </div>
                            <div class="form-group">
                                <input type="password" class="form-control bg-light" placeholder="Password" required>
                            </div>
                            <div class="form-group">
                                <input type="password" class="form-control bg-light" placeholder="Confirm Password" required>
                            </div>
                            <div class="form-check"> 
                                <label class="form-check-label" for="#checkbox">
                                     <input type="checkbox" class="form-check-input" id="checkbox" required> I accept the <a href="#">Terms of Use</a> & <a href="#">Privacy Policy</a>.
                                </label>
                            </div> 
                                    <button type="submit" style="width: 150px;" class="btn btn-primary  mt-2">Sign Up</button>   
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <p class="text-center text-white mt-2">Already have an account ? <a href="#" class="text-white" style="text-decoration:underline;">Login here.</a></p>
    </div>
    </body>
</html>
