<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback Form</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
  <h3 class="mb-4">Feedback Form</h3>

  <form>

    <!-- Name -->
    <div class="mb-3">
      <label class="form-label">Name</label>
      <input type="text" class="form-control" placeholder="Enter your name">
    </div>

    <!-- Email -->
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" placeholder="Enter your email">
    </div>

    <!-- Feedback -->
    <div class="mb-3">
      <label class="form-label">Message</label>
      <textarea class="form-control" rows="3" placeholder="Write your feedback here"></textarea>
    </div>

    <!-- Dropdown -->
    <div class="mb-3">
      <label class="form-label">How did you find our site?</label>
      <select class="form-select">
        <option>Search Engine</option>
        <option>Social Media</option>
        <option>Friend</option>
        <option>Other</option>
      </select>
    </div>

    <!-- Radio Buttons -->
    <div class="mb-3">
      <label class="form-label">Satisfaction (1 to 5)</label><br>
      <input type="radio" name="rate"> 1
      <input type="radio" name="rate"> 2
      <input type="radio" name="rate"> 3
      <input type="radio" name="rate"> 4
      <input type="radio" name="rate"> 5
    </div>

    <!-- Button -->
    <button type="submit" class="btn btn-primary">Submit</button>

  </form>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
